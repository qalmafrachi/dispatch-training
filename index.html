<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dispatch Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a dispatch-desk app. Top bar, then one view at a time: home (dial + this week), lesson player, play room, coach log. */
:root {
  --paper: #eef4f0;
  --surface: #ffffff;
  --surface-2: #f6faf7;
  --ink: #12241c;
  --muted: #4f6a5f;
  --line: #d3e1d8;
  --green: #0b7a4b;
  --green-deep: #08593a;
  --on-green: #ffffff;
  --mint: #c6f1da;
  --sun: #ffc23d;
  --sun-soft: #fff1c9;
  --on-sun: #2b1f00;
  --sky: #2f6feb;
  --sky-soft: #dde8ff;
  --coral: #e2574c;
  --coral-soft: #ffe1dc;
  --shadow: 0 1px 0 rgba(18, 36, 28, .06), 0 8px 24px -12px rgba(18, 36, 28, .25);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 24px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1813; --surface: #14231c; --surface-2: #192b22; --ink: #e6f2ec; --muted: #9ab4a8; --line: #27392f;
    --green: #2fbf7e; --green-deep: #239462; --on-green: #04140c; --mint: #1d4433;
    --sun: #ffca55; --sun-soft: #3a2f12; --on-sun: #231800; --sky: #7aa2ff; --sky-soft: #1c2a4a;
    --coral: #ff8278; --coral-soft: #4a2420; --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1813; --surface: #14231c; --surface-2: #192b22; --ink: #e6f2ec; --muted: #9ab4a8; --line: #27392f;
  --green: #2fbf7e; --green-deep: #239462; --on-green: #04140c; --mint: #1d4433;
  --sun: #ffca55; --sun-soft: #3a2f12; --on-sun: #231800; --sky: #7aa2ff; --sky-soft: #1c2a4a;
  --coral: #ff8278; --coral-soft: #4a2420; --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--display); line-height: 1.1; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }

.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Top bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--green-deep); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--green-deep); color: #fff; }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; color: #fff; padding: 0; }
.brand b { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -.01em; white-space: nowrap; }
@media (max-width: 480px) { .brand b { font-size: 17px; } .pill { padding: 4px 9px; font-size: 13px; } }
.who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 12px; font-size: 14px; font-weight: 700; background: rgba(255,255,255,.14); color: #fff; border: 0; }
.pill.sun { background: var(--sun); color: #2b1f00; }
.pill.link { background: transparent; text-decoration: underline; text-underline-offset: 3px; font-weight: 400; }

main { padding-block: 28px 64px; }

/* Picker */
.picker { display: grid; gap: 24px; justify-items: start; padding-block: 40px; }
.picker h1 { font-size: clamp(36px, 7vw, 64px); font-weight: 800; letter-spacing: -.02em; }
.picker p { color: var(--muted); max-width: 52ch; }
.picker .choices { display: flex; gap: 14px; flex-wrap: wrap; }
.big-name { font-family: var(--display); font-weight: 800; font-size: 28px; padding: 18px 36px; border-radius: var(--r-lg); border: 2px solid var(--green); background: var(--surface); color: var(--green); box-shadow: var(--shadow); transition: transform .15s ease; }
.big-name:hover { transform: translateY(-2px); background: var(--green); color: var(--on-green); }

/* Home */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: center; }
.hero h1 { font-size: clamp(38px, 6vw, 68px); font-weight: 800; letter-spacing: -.025em; }
.hero .sub { margin-top: 12px; font-size: 19px; color: var(--muted); max-width: 46ch; }
.hero .note { margin-top: 18px; display: inline-block; background: var(--sun-soft); color: var(--ink); border-radius: var(--r-md); padding: 10px 14px; font-size: 15px; max-width: 52ch; }
.dial { width: min(260px, 64vw); height: auto; display: block; }
.dial-cap { text-align: center; color: var(--muted); font-size: 15px; margin-top: 6px; }
@media (max-width: 720px) { .hero { grid-template-columns: 1fr; } .dial-box { justify-self: center; } }

.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 44px 0 14px; }
.section-head h2 { font-size: 26px; font-weight: 700; }
.section-head span { color: var(--muted); font-size: 15px; }

.week { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 720px) { .week { grid-template-columns: 1fr; } }
.day-card { position: relative; border: 0; text-align: left; border-radius: var(--r-lg); padding: 24px; display: grid; gap: 10px; min-height: 210px; align-content: start; box-shadow: var(--shadow); overflow: hidden; }
.day-card.learn { background: var(--green); color: var(--on-green); }
.day-card.play { background: var(--sun); color: var(--on-sun); }
.day-card.locked { background: var(--surface); color: var(--muted); box-shadow: none; border: 2px dashed var(--line); cursor: default; }
.day-card .day { font-family: var(--display); font-weight: 700; font-size: 16px; opacity: .85; }
.day-card h3 { font-size: 30px; font-weight: 800; letter-spacing: -.015em; max-width: 16ch; }
.day-card .meta { font-size: 15px; opacity: .9; }
.day-card .go { margin-top: 8px; justify-self: start; font-weight: 700; border-radius: 999px; padding: 8px 18px; background: rgba(255,255,255,.22); }
.day-card.play .go { background: rgba(0,0,0,.1); }
.day-card.done .go { background: var(--surface); color: var(--green); }
.day-card .glyph { position: absolute; right: -18px; bottom: -18px; width: 130px; height: 130px; opacity: .18; }
.day-card:not(.locked):hover { transform: translateY(-2px); }
.day-card { transition: transform .15s ease; }

.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.badge { background: var(--surface); border-radius: var(--r-md); padding: 14px; display: grid; gap: 6px; justify-items: start; border: 1px solid var(--line); }
.badge svg { width: 44px; height: 44px; }
.badge b { font-family: var(--display); font-size: 17px; }
.badge span { font-size: 14px; color: var(--muted); line-height: 1.35; }
.badge.off { opacity: .55; }
.badge.off svg { filter: grayscale(1); }

.path { display: grid; gap: 8px; }
.path-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 16px; text-align: left; }
.path-row .when { font-size: 14px; color: var(--muted); }
.path-row .t { font-weight: 700; }
.path-row .k { font-size: 14px; color: var(--muted); }
.state { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.state.done { background: var(--mint); color: var(--green-deep); }
.state.ready { background: var(--sun); color: #2b1f00; }
.state.locked { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
:root[data-theme="dark"] .state.done, .state.done { color: var(--ink); }

/* Lesson player */
.player { display: grid; gap: 16px; }
.player-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.back { background: none; border: 0; color: var(--muted); padding: 6px 0; font-weight: 700; }
.segs { display: flex; gap: 4px; flex: 1 1 200px; max-width: 420px; }
.seg { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.seg i { display: block; height: 100%; width: 0; background: var(--green); }
.seg.past i { width: 100%; }
.stage { position: relative; border-radius: var(--r-lg); min-height: 460px; padding: clamp(24px, 5vw, 56px); overflow: hidden; box-shadow: var(--shadow); background: var(--surface); display: grid; align-content: center; }
.stage.k-cover, .stage.k-mission { background: var(--green); color: var(--on-green); }
.stage.k-passfail { background: var(--sky-soft); }
.stage.k-ticket { background: var(--surface); }
.slide { display: grid; gap: 22px; animation: rise .45s ease both; min-width: 0; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.slide h2 { font-size: clamp(30px, 5vw, 54px); font-weight: 800; letter-spacing: -.02em; max-width: 20ch; }
.slide .lead { font-size: clamp(18px, 2.2vw, 22px); max-width: 58ch; }
.k-cover h2 { font-size: clamp(44px, 8vw, 92px); }
.controls { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.btn { border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 700; background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.primary { background: var(--green); color: var(--on-green); border-color: var(--green); }
.btn.sun { background: var(--sun); color: #2b1f00; border-color: var(--sun); }
.btn:disabled { opacity: .4; cursor: default; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.watch.on { background: var(--coral); color: #fff; border-color: var(--coral); }

.metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .metrics { grid-template-columns: 1fr; } }
.metric { background: var(--surface-2); border-radius: var(--r-md); padding: 18px; display: grid; gap: 8px; border: 1px solid var(--line); animation: rise .5s ease both; }
.metric:nth-child(2) { animation-delay: .12s; } .metric:nth-child(3) { animation-delay: .24s; }
.metric .n { font-family: var(--display); font-weight: 800; font-size: 34px; }
.metric .tg { font-weight: 700; color: var(--green); }
.metric p { font-size: 15px; }
.metric .d { color: var(--muted); }

.timeline-36 { position: relative; height: 120px; margin-top: 8px; }
.timeline-36 svg { width: 100%; height: 120px; display: block; }

.bars { display: grid; gap: 16px; max-width: 720px; }
.bar-row { display: grid; grid-template-columns: 140px minmax(0, 1fr) 70px; gap: 12px; align-items: center; }
.bar-track { position: relative; height: 34px; background: var(--surface-2); border-radius: 8px; border: 1px solid var(--line); }
.bar-fill { position: absolute; inset: 0 auto 0 0; border-radius: 8px; background: var(--coral); width: 0; transition: width 1s cubic-bezier(.2,.8,.2,1); }
.bar-fill.hit { background: var(--green); }
.bar-target { position: absolute; top: -6px; bottom: -6px; width: 3px; background: var(--ink); border-radius: 2px; }
.bar-row b { font-family: var(--display); font-size: 20px; text-align: right; }
.bar-note { color: var(--muted); font-size: 15px; }
@media (max-width: 560px) { .bar-row { grid-template-columns: 1fr 64px; } .bar-row .bar-track { grid-column: 1 / -1; grid-row: 2; } }

.steps { display: grid; gap: 12px; counter-reset: s; max-width: 680px; padding: 0; margin: 0; list-style: none; }
.steps li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px; align-items: start; background: var(--surface-2); border-radius: var(--r-md); padding: 14px; border: 1px solid var(--line); animation: rise .5s ease both; }
.steps li:nth-child(2) { animation-delay: .15s; } .steps li:nth-child(3) { animation-delay: .3s; }
.steps li::before { counter-increment: s; content: counter(s); font-family: var(--display); font-weight: 800; font-size: 26px; width: 52px; height: 52px; border-radius: 50%; background: var(--green); color: var(--on-green); display: grid; place-items: center; }
.steps b { font-family: var(--display); font-size: 21px; display: block; }

.bullets { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; max-width: 680px; }
.bullets li { padding: 12px 16px; background: var(--surface-2); border-radius: var(--r-md); border: 1px solid var(--line); font-size: 18px; }

/* Work order ticket: the Service Fusion card */
.ticket { background: var(--surface); border-radius: var(--r-md); border: 1px solid var(--line); box-shadow: var(--shadow); display: grid; grid-template-columns: 10px minmax(0, 1fr); overflow: hidden; max-width: 640px; }
.ticket .stripe { background: var(--sun); }
.ticket .body { padding: 16px 18px; display: grid; gap: 6px; min-width: 0; }
.ticket .wo { font-size: 14px; color: var(--muted); }
.ticket .wo b { color: var(--ink); }
.ticket .store { font-family: var(--display); font-weight: 800; font-size: 24px; }
.ticket .addr { color: var(--muted); }
.ticket .clock-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 14px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--line); }
.chip.start { background: var(--sky-soft); border-color: transparent; }
.chip.end { background: var(--coral-soft); border-color: transparent; }
.chip.status { background: var(--sun-soft); border-color: transparent; }
.ticket-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 820px) { .ticket-grid { grid-template-columns: 1fr; } }
.tl { list-style: none; padding: 0; margin: 0; display: grid; gap: 0; }
.tl li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 8px 0; border-left: 3px solid var(--line); padding-left: 14px; position: relative; animation: rise .4s ease both; }
.tl li::before { content: ""; position: absolute; left: -8px; top: 14px; width: 13px; height: 13px; border-radius: 50%; background: var(--green); border: 2px solid var(--surface); }
.tl li:last-child::before { background: var(--coral); }
.tl li b { font-size: 15px; }
.tl li span { font-size: 16px; }
.lesson-box { background: var(--mint); color: var(--ink); border-radius: var(--r-md); padding: 16px 18px; font-size: 18px; font-weight: 700; max-width: 640px; }

/* Play room */
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 16px; font-weight: 700; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.play-head { display: grid; gap: 8px; }
.play-head h1 { font-size: clamp(30px, 5vw, 48px); font-weight: 800; letter-spacing: -.02em; }
.play-head p { color: var(--muted); }

.deck { display: grid; gap: 16px; justify-items: center; padding-block: 12px; }
.flip { perspective: 1200px; width: min(560px, 100%); height: 300px; cursor: pointer; display: block; -webkit-tap-highlight-color: transparent; }
.flip-inner { position: relative; display: block; width: 100%; height: 100%; transition: transform .6s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; -webkit-transform-style: preserve-3d; }
.flip.turned .flip-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--r-lg); padding: 28px 32px; text-align: center; box-shadow: var(--shadow); }
.face.front { background: var(--green); color: var(--on-green); }
.face.back { background: var(--sun); color: #2b1f00; transform: rotateY(180deg); }
.face p { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(21px, 3vw, 28px); line-height: 1.25; max-width: 30ch; text-wrap: balance; }
.face.back p { font-family: var(--body); font-weight: 700; font-size: clamp(18px, 2.4vw, 22px); }
.hint-flip { font-size: 14px; font-weight: 700; padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,.18); }
.deck-count { color: var(--muted); }

.scenario { display: grid; gap: 18px; }
.when-line { font-weight: 700; color: var(--green); }
.ctx { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; max-width: 720px; }
.ctx li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 14px; font-size: 16px; }
.prompt { font-family: var(--display); font-weight: 800; font-size: clamp(24px, 3.4vw, 34px); }
.options { display: grid; gap: 10px; max-width: 760px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 14px 18px; font-size: 17px; transition: border-color .15s ease, transform .15s ease; }
.opt:hover:not(:disabled) { border-color: var(--green); transform: translateX(3px); }
.opt:disabled { cursor: default; }
.opt.picked { border-color: var(--ink); }
.rate { display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 2px 10px; }
.rate.best { background: var(--green); color: var(--on-green); }
.rate.good { background: var(--sky); color: #fff; }
.rate.ok { background: var(--sun); color: #2b1f00; }

.readchk { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 18px 0 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); color: var(--muted); font-weight: 700; font-size: 15px; cursor: default; }
.readchk .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--sky-soft); transition: width .15s linear; z-index: 0; }
.readchk > span:not(.fill) { position: relative; z-index: 1; }
.readchk .box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid currentColor; display: inline-grid; place-items: center; }
.readchk.ready { border-color: var(--green); color: var(--ink); cursor: pointer; animation: nudge 1.4s ease-in-out infinite; }
.readchk.ready .fill { background: transparent; }
.readchk.done { border-color: var(--green); background: var(--green); color: var(--on-green); }
.readchk.done .fill { background: transparent; }
.readchk.done .box { background: var(--on-green); border-color: var(--on-green); }
.readchk.done .box::after { content: ""; width: 10px; height: 6px; border-left: 3px solid var(--green); border-bottom: 3px solid var(--green); transform: rotate(-45deg) translate(1px, -1px); }
.readchk.pop { animation: pop .35s ease-out; }
@keyframes nudge { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
@keyframes pop { 0% { transform: scale(.9); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
#nextBtn:disabled { opacity: .45; cursor: not-allowed; }
@media (prefers-reduced-motion: reduce) { .readchk.ready, .readchk.pop { animation: none; } }
.think-q { font-family: var(--display); font-size: 22px; font-weight: 700; margin: 14px 0 12px; }
.think-a { margin-top: 12px; }
.think-a p { margin: 6px 0 0; }
.facts li { margin-bottom: 4px; }
.rate.miss { background: var(--coral); color: #fff; }
.feedback { border-radius: var(--r-lg); padding: 22px; display: grid; gap: 12px; max-width: 760px; animation: pop .4s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
.feedback.best { background: var(--green); color: var(--on-green); }
.feedback.good { background: var(--sky-soft); }
.feedback.ok { background: var(--sun-soft); }
.feedback.miss { background: var(--sun-soft); border-left: 6px solid var(--coral); }
.feedback h3 { font-size: clamp(22px, 3vw, 30px); font-weight: 800; }
.feedback ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.feedback .pts { font-weight: 700; }

/* Board puzzle */
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; align-items: start; }
@media (max-width: 440px) { .board { grid-template-columns: 1fr; } }
.lane { background: var(--surface); border-radius: var(--r-md); border: 2px solid var(--line); padding: 12px; display: grid; gap: 8px; align-content: start; min-height: 160px; min-width: 0; }
.lane.unsched { background: var(--coral-soft); border-color: transparent; }
.lane.target { border-color: var(--green); border-style: dashed; cursor: pointer; }

.job { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-sm); padding: 8px 10px; display: grid; gap: 2px; font-size: 14px; min-width: 0; }

.coach { display: grid; gap: 20px; }

.table-box { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 15px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }

/* Who takes it? */
.mapwrap { max-width: 760px; }
.mapsvg { width: 100%; height: auto; display: block; border-radius: 18px; }

.techs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; max-width: 760px; }
.tech { text-align: left; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: start; border: 2px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 12px; font-size: 15px; }
.tech:hover:not(:disabled) { border-color: var(--green); }
.tech.picked { border-color: var(--ink); }

.tech .ini { width: 40px; height: 40px; border-radius: 50%; background: var(--green); color: var(--on-green); display: grid; place-items: center; font-family: var(--display); font-weight: 800; }

.techs { max-width: 760px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.tech .tech-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

.tech .tday { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 8px; margin: 2px 0 0; font-size: 14px; line-height: 1.35; }
.tech .tday dt { color: var(--muted); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding-top: 2px; }
.tech .tday dd { margin: 0; }
.tech .rate { align-self: flex-start; margin-top: 4px; }
.map-tip { margin: 6px 0 10px; }
.pin:not([data-tech]) { cursor: default; }
/* Spot the lazy choice */
.spot-count { font-family: var(--display); font-weight: 800; font-size: 22px; }
.lane-name { border: 0; background: none; text-align: left; padding: 0; display: grid; gap: 2px; cursor: pointer; }
.board.spot .job { cursor: pointer; }
.board.spot .job:hover, .lane-name:hover h4 { text-decoration: underline; text-underline-offset: 3px; }
.job.found, .lane.found { outline: 3px solid var(--green); outline-offset: -1px; background: var(--mint); }
/* Beat the clock */
.clock-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: center; max-width: 820px; }
@media (max-width: 640px) { .clock-head { grid-template-columns: 1fr; justify-items: start; } }
.ring-box { display: grid; justify-items: center; gap: 4px; text-align: center; }
.ring { width: 170px; height: 170px; }
.speed { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; max-width: 760px; }
.speed i { display: block; height: 100%; width: 100%; background: var(--sun); transition: width .2s linear; }
/* PIN */
.pin-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.input.pin { font-size: 24px; letter-spacing: .3em; width: 200px; text-align: center; border-radius: var(--r-md); }
[hidden] { display: none !important; }
/* Desk rules strip */
.rules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 28px; }
.rules div { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--green); border-radius: var(--r-md); padding: 14px 16px; display: grid; gap: 4px; }
.rules b { font-family: var(--display); font-size: 18px; }
.rules span { font-size: 15px; color: var(--muted); }
@media (max-width: 720px) { .rules { grid-template-columns: 1fr; } }
/* Slide extras */
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.col { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; animation: rise .45s ease both; min-width: 0; }
.col b { font-family: var(--display); font-size: 19px; display: block; margin-bottom: 6px; }
.col ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 16px; }
.lead.cap { font-weight: 700; }
.stat { display: grid; gap: 6px; }
.stat .big { font-family: var(--display); font-weight: 800; font-size: clamp(64px, 12vw, 128px); line-height: .95; color: var(--coral); letter-spacing: -.03em; }
.stat .lbl { font-size: clamp(18px, 2.2vw, 22px); max-width: 44ch; font-weight: 700; }
.shift-box { overflow-x: auto; }
table.shifts { min-width: 560px; font-size: 15px; }
table.shifts td, table.shifts th { padding: 7px 8px; text-align: center; }

table.shifts td:last-child { text-align: left; white-space: nowrap; }
table.shifts .k { display: block; font-size: 12px; }
.sh { display: inline-block; width: 22px; height: 22px; border-radius: 6px; vertical-align: middle; }
.sh.day { background: var(--green); }
.sh.eve { background: var(--sky); }
.sh.off { background: var(--surface-2); border: 1px dashed var(--line); }
.legend { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.legend .sh { width: 14px; height: 14px; border-radius: 4px; }
table.rot-table { min-width: 480px; }
/* Admin editor */
.k { color: var(--muted); font-size: 14px; }
.admin-form { display: grid; gap: 14px; }
.fld { display: grid; gap: 6px; min-width: 0; }
.fld > span { font-size: 14px; font-weight: 700; color: var(--muted); }
.fld .input, textarea.input, select.input { border-radius: var(--r-sm); width: 100%; }
textarea.input { resize: vertical; line-height: 1.45; }
.fld.inline { display: inline-grid; grid-template-columns: auto 90px; align-items: center; gap: 8px; }
.fld.check { grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 10px; }

.grp { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px 14px; margin: 0; display: grid; gap: 12px; min-width: 0; }

.item { background: var(--surface-2); border-radius: var(--r-sm); padding: 12px; display: grid; gap: 10px; }
.item-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.poly { gap: 14px; }
.poly .item-head select { width: auto; flex: 1 1 200px; max-width: 320px; }
.poly-n { font-family: var(--display); font-weight: 800; font-size: 20px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--green); color: var(--on-green); }
.btn.sm { padding: 8px 14px; font-size: 15px; }

.btn.danger { background: var(--coral); color: #fff; border-color: var(--coral); }
.btn.danger-ghost { color: var(--coral); border-color: var(--coral); background: transparent; }
.admin-row { grid-template-columns: 110px minmax(0, 1fr) auto; }
@media (max-width: 640px) { .admin-row { grid-template-columns: 1fr; } }
.editor { padding-bottom: 80px; }
.savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--surface); border-top: 1px solid var(--line); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -8px 24px -16px rgba(0,0,0,.4); }

/* Toast and confetti */
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(140%); background: var(--ink); color: var(--paper); border-radius: 999px; padding: 12px 20px; font-weight: 700; z-index: 30; transition: transform .35s cubic-bezier(.2,1.2,.4,1), opacity .2s ease; max-width: calc(100% - 32px); text-align: center; opacity: 0; visibility: hidden; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
